# .aikit-rules.yml — AI Dev Kit custom rules
# Place this file at the project root as: .aikit-rules.yml
#
# Severities: CRITICAL | HIGH | MEDIUM | LOW
# files: comma-separated glob (e.g. "*.java", "*.ts,*.tsx", "*")
# pattern: regex compatible with grep -P

rules:
  # Example: block System.exit() anywhere in production code
  - id: C-001
    severity: HIGH
    files: "*.java"
    pattern: 'System\.exit\('
    message: "System.exit() must not be used in production. Throw a proper exception instead."

  # Example: ban imports from deprecated internal packages
  - id: C-002
    severity: MEDIUM
    files: "*.java"
    pattern: 'import com\.example\.legacy\.'
    message: "Deprecated legacy package. Use the equivalent classes in com.example.core."

  # Example: ban raw fetch() calls in React components (use custom hooks instead)
  - id: C-003
    severity: MEDIUM
    files: "*.tsx,*.ts"
    pattern: '^\s*fetch\s*\('
    message: "Use the custom useApi() hook instead of calling fetch() directly in components."

  # Example: enforce safe DROP TABLE in SQL migrations
  - id: C-004
    severity: LOW
    files: "*.sql"
    pattern: 'DROP TABLE(?! IF EXISTS)'
    message: "Prefer DROP TABLE IF EXISTS to avoid errors on re-execution."

  # Example: no console.error in test files (spy on it instead)
  - id: C-005
    severity: LOW
    files: "*.spec.ts"
    pattern: 'console\.error\('
    message: "In tests, spy on console.error instead of calling it directly."
